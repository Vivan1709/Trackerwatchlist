name: Publish website
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site folder and push it to the gh-pages branch
        run: |
          mkdir -p _site && cp -r web/public/. _site/ && cp -r data _site/data && cp portfolio.json _site/ && touch _site/.nojekyll
          cd _site && git init -q -b gh-pages && git add -A
          git -c user.name=big-money-tracker-bot -c user.email=actions@users.noreply.github.com commit -qm "Publish $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
