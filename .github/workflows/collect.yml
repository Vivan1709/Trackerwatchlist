name: Nightly NSE collection

on:
  schedule:
    - cron: "*/30 3-18 * * 1-5"   # every 30 minutes, 9:00 AM to 12:30 AM IST, Monday to Friday
    - cron: "40 1 * * 2-6"        # 7:10 AM IST next morning, catches anything missed
  workflow_dispatch:
    inputs:
      symbols:
        description: "Only these symbols (comma separated), for a company just added"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect-${{ github.event.inputs.symbols || 'all' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Collect from NSE
        run: python collect.py
        env:
          ONLY_SYMBOLS: ${{ github.event.inputs.symbols }}
      - name: Save data
        if: always()
        run: |
          git config user.name "big-money-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "NSE data $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
