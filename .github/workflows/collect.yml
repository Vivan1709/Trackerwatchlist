name: Nightly NSE collection

on:
  schedule:
    - cron: "40 16 * * 1-5"   # 10:10 PM IST, Monday to Friday
    - cron: "40 1 * * 2-6"    # 7:10 AM IST next morning, catches anything missed
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Collect from NSE
        run: python collect.py
      - name: Save data
        if: always()
        run: |
          git config user.name "big-money-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "NSE data $(date -u +%F)"
          git push
